version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT:-8000}
    container_name: pyq_hostinger_app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8000}
    volumes:
      - paper_cache:/app/cache/papers
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${PORT:-8000}/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  paper_cache:
